<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>

    <style>
      :not(:defined) > * {
        display: none;
      }

      body {
        background: #eee;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
      }

      model-viewer {
        width: 80vw;
        height: 80vh;
        background-color: #eee;
        overflow-x: hidden;
        position: relative;
      }

      #ar-button {
        background-image: url(../../assets/ic_view_in_ar_new_googblue_48dp.png);
        background-repeat: no-repeat;
        background-size: 20px 20px;
        background-position: 12px 50%;
        background-color: #fff;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        bottom: 132px;
        padding: 0px 16px 0px 40px;
        font-family: Roboto Regular, Helvetica Neue, sans-serif;
        font-size: 14px;
        color: #4285f4;
        height: 36px;
        line-height: 36px;
        border-radius: 18px;
        border: 1px solid #dadce0;
        cursor: pointer;
      }

      #ar-button:active {
        background-color: #e8eaed;
      }
      #ar-button:focus {
        outline: none;
      }
      #ar-button:focus-visible {
        outline: 1px solid #4285f4;
      }

      @keyframes circle {
        from {
          transform: translateX(-50%) rotate(0deg) translateX(50px) rotate(0deg);
        }
        to {
          transform: translateX(-50%) rotate(360deg) translateX(50px)
            rotate(-360deg);
        }
      }

      @keyframes elongate {
        from {
          transform: translateX(100px);
        }
        to {
          transform: translateX(-100px);
        }
      }

      model-viewer > #ar-prompt {
        position: absolute;
        left: 50%;
        bottom: 175px;
        animation: elongate 2s infinite ease-in-out alternate;
        display: none;
      }

      model-viewer[ar-status="session-started"] > #ar-prompt {
        display: block;
      }

      model-viewer > #ar-prompt > img {
        animation: circle 4s linear infinite;
      }

      model-viewer > #ar-failure {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 175px;
        display: none;
      }

      model-viewer[ar-tracking="not-tracking"] > #ar-failure {
        display: block;
      }

      .slider {
        width: 100%;
        text-align: center;
        overflow: hidden;
        position: absolute;
        bottom: 16px;
      }

      .slides {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }

      .slide {
        scroll-snap-align: start;
        flex-shrink: 0;
        width: 100px;
        height: 100px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        background-color: #fff;
        margin-right: 10px;
        border-radius: 10px;
        border: none;
        display: flex;
        cursor: pointer;
      }

      .slide.selected {
        border: 2px solid #4285f4;
      }

      .upload-section {
        margin-top: 20px;
        text-align: center;
      }

      input[type="file"] {
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <model-viewer
      id="slider-viewer"
      shadow-intensity="1"
      ar
      camera-controls
      touch-action="pan-y"
      alt="A 3D model carousel"
      src="lambo.glb"
      poster="lambo.png"
    >
      <button slot="ar-button" id="ar-button">View in your space</button>

      <div id="ar-prompt">
        <img src="../../assets/hand.png" />
      </div>

      <div class="slider">
        <div class="slides"></div>
      </div>
    </model-viewer>

    <div class="upload-section">
      <h3>Upload Multiple Models</h3>
      <input type="file" id="modelUpload" multiple accept=".glb" />
    </div>

    <script type="module">
      function displaySlider(modelViewer, models) {
        const slidesContainer = modelViewer.querySelector(".slides");

        // Function to render all slides
        function renderSlides() {
          slidesContainer.innerHTML = "";
          models.forEach((model, index) => {
            const btn = document.createElement("button");
            btn.className = "slide" + (index === 0 ? " selected" : "");
            btn.style.backgroundImage = `url('${model.thumbnail}')`;

            btn.addEventListener("click", () => {
              modelViewer.src = model.src;
              modelViewer.poster = model.thumbnail;

              slidesContainer
                .querySelectorAll(".slide")
                .forEach((s) => s.classList.remove("selected"));
              btn.classList.add("selected");
            });

            slidesContainer.appendChild(btn);
          });
        }

        // Initial render
        renderSlides();

        // Prevent XR interference
        modelViewer
          .querySelector(".slider")
          .addEventListener("beforexrselect", (ev) => ev.preventDefault());

        // AR status prompt
        modelViewer.addEventListener("ar-status", (event) => {
          const prompt = modelViewer.querySelector("#ar-prompt");
          prompt.style.display =
            event.detail.status === "session-started" ? "block" : "none";
        });

        // File upload functionality
        const fileInput = document.getElementById("modelUpload");
        fileInput.addEventListener("change", (e) => {
          const files = Array.from(e.target.files);
          const glbFiles = files.filter((f) => f.name.endsWith(".glb"));
          const webpFiles = files.filter((f) => f.name.endsWith(".webp"));

          // Match glb and webp by filename (ignoring extension)
          glbFiles.forEach((glbFile) => {
            const baseName = glbFile.name.replace(".glb", "");
            const thumbnailFile = webpFiles.find((w) =>
              w.name.includes(baseName)
            );

            const glbURL = URL.createObjectURL(glbFile);
            const thumbURL = thumbnailFile
              ? URL.createObjectURL(thumbnailFile)
              : "";

            models.push({
              name: baseName,
              src: glbURL,
              thumbnail: thumbURL,
            });
          });

          // Re-render updated models
          renderSlides();
        });
      }

      // Default model data
      const modelData = [
        {
          name: "Chair",
          src: "../../assets/ShopifyModels/Chair.glb",
          thumbnail: "lambo.png",
        },
      ];

      const modelViewer = document.querySelector("#slider-viewer");
      displaySlider(modelViewer, modelData);
    </script>
  </body>
</html>
