<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic 3D Model Viewer</title>
  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
  ></script>
</head>
<body>

  <model-viewer
    id="viewer"
    src=""
    poster=""
    shadow-intensity="1"
    ar
    camera-controls
    touch-action="pan-y"
    alt="A 3D model carousel"
  >
    <button slot="ar-button" id="ar-button">View in your space</button>

    <div id="ar-prompt">
      <img src="../../assets/hand.png" />
    </div>

    <!-- <button id="ar-failure">AR is not tracking!</button> -->

    <div class="slider">
      <div class="slides" id="slides-container">
        <!-- All thumbnails will be dynamically added here -->
      </div>
    </div>
  </model-viewer>

  <!-- Upload Section -->
  <div class="upload-section">
    <h3>Upload a New 3D Model</h3>
    <label>Model (.glb):</label>
    <input type="file" id="glbUpload" accept=".glb" /><br /><br />
    <label>Thumbnail (image):</label>
    <input type="file" id="thumbUpload" accept="image/*" /><br /><br />
    <button id="addModelBtn">Add Model</button>
  </div>

  <script type="module">
    const modelViewer = document.getElementById("viewer");
    const slidesContainer = document.getElementById("slides-container");
    const glbInput = document.getElementById("glbUpload");
    const thumbInput = document.getElementById("thumbUpload");
    const addBtn = document.getElementById("addModelBtn");

    // Track uploaded models
    let uploadedModels = [];
    let nextUploadId = 1;

    addBtn.addEventListener("click", () => {
      const glbFile = glbInput.files[0];
      const thumbFile = thumbInput.files[0];

      if (!glbFile || !thumbFile) {
        alert("Please select both a .glb model and a thumbnail image!");
        return;
      }

      if (!glbFile.name.toLowerCase().endsWith(".glb")) {
        alert("Please upload a valid .glb file (filename must end with .glb).");
        return;
      }

      const glbURL = URL.createObjectURL(glbFile);
      const thumbURL = URL.createObjectURL(thumbFile);
      const modelName = glbFile.name.replace(/\.glb$/i, "");
      const id = "uploaded-" + nextUploadId++;

      // Create wrapper div
      const wrapper = document.createElement("div");
      wrapper.classList.add("slide-wrapper");
      wrapper.dataset.uploadId = id;

      // Create thumbnail button
      const newSlide = document.createElement("button");
      newSlide.classList.add("slide");
      newSlide.style.backgroundImage = `url('${thumbURL}')`;
      newSlide.title = modelName;

      // Clicking loads this model
      newSlide.addEventListener("click", () => {
        modelViewer.src = glbURL;
        modelViewer.poster = thumbURL;
        document.querySelectorAll(".slide-wrapper").forEach(w => w.classList.remove("selected"));
        wrapper.classList.add("selected");
      });

      // Create remove (×) button
      const removeBtn = document.createElement("span");
      removeBtn.classList.add("remove-btn");
      removeBtn.innerHTML = "&times;";

      removeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const currentSrc = modelViewer.src || "";

        // If currently showing this model, clear it
        if (currentSrc === glbURL || currentSrc.includes(glbURL)) {
          modelViewer.src = "";
          modelViewer.poster = "";
        }

        // Revoke blob URLs
        URL.revokeObjectURL(glbURL);
        URL.revokeObjectURL(thumbURL);

        // Remove record
        uploadedModels = uploadedModels.filter(m => m.id !== id);

        // Remove element from DOM
        wrapper.remove();
      });

      // Assemble thumbnail
      wrapper.appendChild(newSlide);
      wrapper.appendChild(removeBtn);
      slidesContainer.appendChild(wrapper);

      // Save reference
      uploadedModels.push({ id, modelName, glbURL, thumbURL, wrapper });

      // Reset inputs
      glbInput.value = "";
      thumbInput.value = "";
    });
  </script>

  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 80vw;
      height: 70vh;
      background-color: #eee;
      overflow-x: hidden;
    }

    .upload-section {
      margin-top: 20px;
      text-align: center;
      background: #333;
      padding: 15px;
      border-radius: 10px;
    }

    .upload-section input,
    .upload-section button {
      margin: 5px;
    }

    #ar-button {
      background-image: url(../../assets/ic_view_in_ar_new_googblue_48dp.png);
      background-repeat: no-repeat;
      background-size: 20px 20px;
      background-position: 12px 50%;
      background-color: #fff;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 132px;
      padding: 0px 16px 0px 40px;
      font-size: 14px;
      color: #4285f4;
      height: 36px;
      line-height: 36px;
      border-radius: 18px;
      border: 1px solid #dadce0;
    }

    .slider {
      width: 100%;
      text-align: center;
      overflow: hidden;
      position: absolute;
      bottom: 16px;
    }

    .slides {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .slide-wrapper {
      position: relative;
      margin-right: 10px;
      display: flex;
    }

    .slide {
      scroll-snap-align: start;
      flex-shrink: 0;
      width: 100px;
      height: 100px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #fff;
      border-radius: 10px;
      border: none;
      display: flex;
    }

    .slide-wrapper.selected .slide {
      border: 2px solid #4285f4;
    }

    .remove-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #ff5555;
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      text-align: center;
      line-height: 18px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .remove-btn:hover {
      background: #ff2222;
    }
  </style>
</body>
</html>
