<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>

    <style>
      :not(:defined) > * {
        display: none;
      }

      body {
        background: #eee;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
      }

      model-viewer {
        width: 80vw;
        height: 80vh;
        background-color: #eee;
        overflow-x: hidden;
        position: relative;
      }

      #ar-button {
        background-image: url(../../assets/ic_view_in_ar_new_googblue_48dp.png);
        background-repeat: no-repeat;
        background-size: 20px 20px;
        background-position: 12px 50%;
        background-color: #fff;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        bottom: 132px;
        padding: 0px 16px 0px 40px;
        font-family: Roboto Regular, Helvetica Neue, sans-serif;
        font-size: 14px;
        color: #4285f4;
        height: 36px;
        line-height: 36px;
        border-radius: 18px;
        border: 1px solid #dadce0;
        cursor: pointer;
      }

      #ar-button:active {
        background-color: #e8eaed;
      }
      #ar-button:focus {
        outline: none;
      }
      #ar-button:focus-visible {
        outline: 1px solid #4285f4;
      }

      @keyframes circle {
        from {
          transform: translateX(-50%) rotate(0deg) translateX(50px) rotate(0deg);
        }
        to {
          transform: translateX(-50%) rotate(360deg) translateX(50px)
            rotate(-360deg);
        }
      }

      @keyframes elongate {
        from {
          transform: translateX(100px);
        }
        to {
          transform: translateX(-100px);
        }
      }

      model-viewer > #ar-prompt {
        position: absolute;
        left: 50%;
        bottom: 175px;
        animation: elongate 2s infinite ease-in-out alternate;
        display: none;
      }

      model-viewer[ar-status="session-started"] > #ar-prompt {
        display: block;
      }

      model-viewer > #ar-prompt > img {
        animation: circle 4s linear infinite;
      }

      model-viewer > #ar-failure {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 175px;
        display: none;
      }

      model-viewer[ar-tracking="not-tracking"] > #ar-failure {
        display: block;
      }

      .slider {
        width: 100%;
        text-align: center;
        overflow: hidden;
        position: absolute;
        bottom: 16px;
      }

      .slides {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }

      .slide {
        scroll-snap-align: start;
        flex-shrink: 0;
        width: 100px;
        height: 100px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        background-color: #fff;
        margin-right: 10px;
        border-radius: 10px;
        border: none;
        display: flex;
        cursor: pointer;
      }

      .slide.selected {
        border: 2px solid #4285f4;
      }

      .upload-section {
        margin-top: 20px;
        text-align: center;
      }

      .upload-group {
        margin: 10px 0;
        padding: 15px;
        border: 2px solid #4285f4;
        border-radius: 8px;
        background: #f9f9f9;
      }

      .upload-group h4 {
        margin: 0 0 10px 0;
        font-size: 16px;
        color: #333;
      }

      .upload-note {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
      }

      .btn-primary {
        background: #4285f4;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        margin: 5px;
      }

      .btn-primary:hover {
        background: #3367d6;
      }

      .btn-primary:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .btn-success {
        background: #34a853;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        margin: 5px;
      }

      .btn-success:hover {
        background: #2d8e47;
      }

      .btn-danger {
        background: #ea4335;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        margin: 5px;
      }

      .btn-danger:hover {
        background: #c5221f;
      }

      .pending-model-box {
        border: 2px dashed #4285f4;
        border-radius: 8px;
        padding: 15px;
        background: #e8f0fe;
        margin: 10px 0;
      }

      .pending-model-box h4 {
        color: #1967d2;
        margin: 0 0 10px 0;
      }

      .pending-model-box p {
        font-size: 13px;
        color: #174ea6;
        margin: 5px 0;
      }

      input[type="file"] {
        display: none;
      }
    </style>
  </head>

  <body>
    <model-viewer
      id="slider-viewer"
      shadow-intensity="1"
      ar
      camera-controls
      touch-action="pan-y"
      alt="A 3D model carousel"
      src="lambo.glb"
      poster="lambo.png"
    >
      <button slot="ar-button" id="ar-button">View in your space</button>

      <div id="ar-prompt">
        <img src="../../assets/hand.png" />
      </div>

      <div class="slider">
        <div class="slides"></div>
      </div>
    </model-viewer>

    <div class="upload-section">
      <div class="upload-group">
        <h4>Upload GLB Model</h4>
        <input type="file" id="modelUpload" accept=".glb" />
        <button
          class="btn-primary"
          id="uploadBtn"
          onclick="document.getElementById('modelUpload').click()"
        >
          Choose GLB File
        </button>
        <div class="upload-note">Supports .glb files only.</div>
      </div>

      <!-- Pending Model Box (Hidden by default) -->
      <div id="pendingBox" class="pending-model-box" style="display: none">
        <h4>Add Thumbnail (Optional)</h4>
        <p id="pendingModelName">Model uploaded successfully!</p>
        <input type="file" id="thumbnailUpload" accept="image/*" />
        <button
          class="btn-primary"
          onclick="document.getElementById('thumbnailUpload').click()"
        >
          Upload Thumbnail
        </button>
        <div class="upload-note">
          PNG, JPG, WEBP supported. Recommended: 200x200px
        </div>
        <div style="margin-top: 10px">
          <button class="btn-success" id="useDefaultBtn">
            Use Default Thumbnail
          </button>
          <button class="btn-danger" id="cancelBtn">Cancel</button>
        </div>
      </div>
    </div>

    <script type="module">
      let pendingModel = null;

      function displaySlider(modelViewer, models) {
        const slidesContainer = modelViewer.querySelector(".slides");

        function renderSlides() {
          slidesContainer.innerHTML = "";

          models.forEach((model, index) => {
            const slideBtn = document.createElement("button");
            slideBtn.className = "slide" + (index === 0 ? " selected" : "");
            slideBtn.style.backgroundImage = `url('${model.thumbnail}')`;

            // Click to switch model
            slideBtn.addEventListener("click", () => {
              modelViewer.src = model.src;
              modelViewer.poster = model.thumbnail;

              slidesContainer
                .querySelectorAll(".slide")
                .forEach((s) => s.classList.remove("selected"));
              slideBtn.classList.add("selected");
            });

            const deleteBtn = document.createElement("span");
            deleteBtn.innerHTML = "&times;";
            deleteBtn.style.cssText = `
        position: absolute;
        top: 2px;
        right: 2px;
        background: rgba(255,255,255,0.8);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        text-align: center;
        line-height: 18px;
        cursor: pointer;
        font-weight: bold;
        z-index: 10;
      `;

            deleteBtn.addEventListener("click", (e) => {
              e.stopPropagation();

              // Store if this was the selected model
              const wasSelected = modelViewer.src === model.src;

              // Remove from array
              const modelIndex = models.indexOf(model);
              if (modelIndex > -1) {
                models.splice(modelIndex, 1);
              }

              // Re-render slides
              renderSlides();

              // If deleted model was selected and there are models left, switch to first
              if (wasSelected) {
                if (models.length > 0) {
                  modelViewer.src = models[0].src;
                  modelViewer.poster = models[0].thumbnail;
                } else {
                  // If no models left, clear the viewer
                  modelViewer.src = "";
                  modelViewer.poster = "";
                }
              }
            });

            slideBtn.style.position = "relative";
            slideBtn.appendChild(deleteBtn);

            slidesContainer.appendChild(slideBtn);
          });
        }

        // --- Initial render ---
        renderSlides();

        // --- Prevent XR interference ---
        modelViewer
          .querySelector(".slider")
          .addEventListener("beforexrselect", (ev) => ev.preventDefault());

        // --- AR prompt handling ---
        modelViewer.addEventListener("ar-status", (event) => {
          const prompt = modelViewer.querySelector("#ar-prompt");
          prompt.style.display =
            event.detail.status === "session-started" ? "block" : "none";
        });

        // --- Generate default thumbnail ---
        function generateDefaultThumbnail(fileName) {
          const canvas = document.createElement("canvas");
          canvas.width = 200;
          canvas.height = 200;
          const ctx = canvas.getContext("2d");

          // Create gradient background
          const gradient = ctx.createLinearGradient(0, 0, 200, 200);
          gradient.addColorStop(0, "#3b82f6");
          gradient.addColorStop(1, "#1e40af");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, 200, 200);

          // Add text
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 16px Arial";
          ctx.textAlign = "center";
          ctx.fillText("3D Model", 100, 90);
          ctx.font = "12px Arial";
          const displayName =
            fileName.length > 15 ? fileName.slice(0, 15) + "..." : fileName;
          ctx.fillText(displayName, 100, 110);
          ctx.fillText("No Thumbnail", 100, 130);

          return canvas.toDataURL();
        }

        // --- Step 1: Handle GLB file upload ---
        const fileInput = document.getElementById("modelUpload");
        const pendingBox = document.getElementById("pendingBox");
        const pendingModelName = document.getElementById("pendingModelName");

        fileInput.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (!file) return;

          // Validate file type
          if (!file.name.toLowerCase().endsWith(".glb")) {
            alert("Please upload a .glb file");
            e.target.value = "";
            return;
          }

          const glbURL = URL.createObjectURL(file);
          const baseName = file.name.replace(".glb", "");
          const defaultThumbnail = generateDefaultThumbnail(baseName);

          // Store pending model
          pendingModel = {
            name: baseName,
            src: glbURL,
            thumbnail: defaultThumbnail,
            file: file,
          };

          // Show pending box
          pendingBox.style.display = "block";
          pendingModelName.textContent = `Model "${baseName}" uploaded successfully!`;

          // Reset file input
          e.target.value = "";
        });

        // --- Step 2: Handle thumbnail upload ---
        const thumbnailInput = document.getElementById("thumbnailUpload");

        thumbnailInput.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (!file || !pendingModel) return;

          // Validate file type
          if (!file.type.startsWith("image/")) {
            alert("Please upload an image file (PNG, JPG, WEBP)");
            e.target.value = "";
            return;
          }

          const reader = new FileReader();
          reader.onload = (event) => {
            // Update pending model with custom thumbnail
            pendingModel.thumbnail = event.target.result;

            // Add model to collection
            addModelToCollection();
          };

          reader.readAsDataURL(file);
          e.target.value = "";
        });

        // --- Use default thumbnail button ---
        document
          .getElementById("useDefaultBtn")
          .addEventListener("click", () => {
            if (pendingModel) {
              addModelToCollection();
            }
          });

        // --- Cancel button ---
        document.getElementById("cancelBtn").addEventListener("click", () => {
          if (pendingModel) {
            URL.revokeObjectURL(pendingModel.src);
            pendingModel = null;
            pendingBox.style.display = "none";
          }
        });

        // --- Add model to collection ---
        function addModelToCollection() {
          if (!pendingModel) return;

          models.push({
            name: pendingModel.name,
            src: pendingModel.src,
            thumbnail: pendingModel.thumbnail,
          });

          renderSlides();

          // Select the newly added model
          const newIndex = models.length - 1;
          modelViewer.src = models[newIndex].src;
          modelViewer.poster = models[newIndex].thumbnail;

          // Clear pending model
          pendingModel = null;
          pendingBox.style.display = "none";
        }
      }

      let modelData = [
        {
          name: "Chair",
          src: "lambo.glb",
          thumbnail: "lambo.png",
        },
      ];

      const modelViewer = document.querySelector("#slider-viewer");
      displaySlider(modelViewer, modelData);
    </script>
  </body>
</html>
